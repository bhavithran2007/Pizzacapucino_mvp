<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Pizza Capucino</title>
  <style>
    :root {
      --bg: #111111;
      --panel: #1c1c1c;
      --panel-border: rgba(255, 255, 255, 0.08);
      --text: #f5f1e8;
      --muted: #c9bea8;
      --accent: #e4c590;
      --accent-strong: #ad8455;
      --danger: #ff8a8a;
      --field: #252525;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "DM Sans", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top right, rgba(228, 197, 144, 0.18), transparent 30%),
        radial-gradient(circle at bottom left, rgba(173, 132, 85, 0.15), transparent 35%),
        var(--bg);
    }

    .card {
      width: min(100%, 420px);
      border: 1px solid var(--panel-border);
      border-radius: 24px;
      background: rgba(28, 28, 28, 0.94);
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 2rem;
      font-family: "Forum", Georgia, serif;
      font-weight: 400;
      letter-spacing: 0.04em;
    }

    p {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.6;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    input {
      width: 100%;
      margin-bottom: 18px;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid var(--panel-border);
      background: var(--field);
      color: var(--text);
      font-size: 1rem;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 999px;
      padding: 14px 18px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      color: #111111;
      background: linear-gradient(135deg, var(--accent), #f4ddb2);
    }

    button:disabled {
      opacity: 0.7;
      cursor: wait;
    }

    .status {
      min-height: 22px;
      margin-top: 16px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .status.error {
      color: var(--danger);
    }
  </style>
</head>
<body data-page="login">
  <main class="card">
    <h1>Admin Login</h1>
    <p>Part 1 of the MVP is ready for secure admin access. Use the seeded username and password from your environment.</p>

    <form id="login-form">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <button id="login-button" type="submit">Sign In</button>
      <div id="status" class="status" aria-live="polite"></div>
    </form>
  </main>

  <script src="/admin-assets/admin.js"></script>
</body>
</html>
